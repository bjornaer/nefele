  <meta name="description" content="Nefele">
  <style>
    :root { color-scheme: light dark; --fg: #1a1a1a; --bg: #fafafa; --muted: #666; }

    * { margin: 0; box-sizing: border-box; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 1rem;
           font-family: system-ui, sans-serif; color: var(--fg); background: var(--bg); text-align: center; }
    h1 { font-size: clamp(2.5rem, 10vw, 5rem); font-weight: 300; letter-spacing: .1em; }
    p { color: var(--muted); margin-top: 1rem; }
  </style>
</head>
